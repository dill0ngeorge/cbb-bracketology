name: Publish site

# Re-publish the site when outputs/ changes from a regular push (commits made by
# the daily workflow deploy themselves, since bot pushes don't trigger workflows).
on:
  push:
    branches: [main]
    paths: ["outputs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs
      - id: deployment
        uses: actions/deploy-pages@v4
