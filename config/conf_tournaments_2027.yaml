# Conference tournament formats, 2026-27 season (2027 tournaments).
#
# entry: seeds entering each round, first round first. Seeds not listed do not
#   qualify. In every round, the teams left are paired best seed vs worst seed
#   (a re-seeding rule that matches most published brackets closely enough for
#   auto-bid odds).
# site: neutral | campus (higher seed hosts every round) | campus_rounds: N
#   (higher seed hosts the first N rounds, neutral after).
# confidence: verified = checked against a 2027 announcement;
#   assumed_2026 = last season's format, not yet confirmed for 2027.
#
# Check and edit freely; the simulator validates that every round pairs evenly.

